<!-- Simplest way to add this to another site: a section that iframes the standalone page.
     Zero CSS/JS conflicts. Host standalone/index.html anywhere (same site or CDN). -->
<section id="earth-applications" style="padding:0">
  <iframe src="/ember-atlas-earth/index.html" title="Ember Atlas: Earth applications"
          style="width:100%;height:100vh;min-height:640px;border:0;display:block"
          loading="lazy"></iframe>
</section>
